name = "axim-coding-lab-worker"
main = "src/ingress.ts"
compatibility_date = "2026-07-11"
workers_dev = true
triggers = { crons = ["0 14 * * *", "0 3 * * *", "0 */6 * * *"] }

[vars]
ENVIRONMENT = "production"
SUPABASE_URL = "https://pvbcdndqjguzqeafhwhw.supabase.co"
SUPABASE_LLM_PROXY_URL = "https://pvbcdndqjguzqeafhwhw.supabase.co/functions/v1/llm-proxy"

# Idempotency & State Caching
[[kv_namespaces]]
binding = "LAB_STATE"
id = "afc3219e3592439b8d3ae6fcb2f40004"

[[kv_namespaces]]
binding = "TASK_LOCKS"
id = "f399b6d9a6e7425aa3cb648e742ab4b8"

# -----------------------------------------------------------------------------
# Swarm queue (optional, off by default)
# -----------------------------------------------------------------------------
# Without this binding, multi-file tasks run inline via `ctx.waitUntil`.
# Enable both halves together: a producer with no consumer acks work at the edge
# and drops it, which is what `queue()` in src/ingress.ts now prevents if the
# consumer block below is uncommented as well.
#
#   npx wrangler queues create axim-swarm-queue
#
# [[queues.producers]]
# binding = "SWARM_QUEUE"
# queue = "axim-swarm-queue"
#
# [[queues.consumers]]
# queue = "axim-swarm-queue"
# max_batch_size = 5
# max_retries = 3

# -----------------------------------------------------------------------------
# SECRET VAULTING INSTRUCTIONS (Execute via Cloudflare CLI, do not hardcode):
# -----------------------------------------------------------------------------
# 1. wrangler secret put AXIM_INTERNAL_KEY
# 2. wrangler secret put GITHUB_TOKEN (Requires repo, workflow, and PR scopes)
# 3. wrangler secret put SUPABASE_SECRET_KEY
# 4. wrangler secret put EMAILIT_API_KEY
# 5. wrangler secret put JULES_API_KEY
